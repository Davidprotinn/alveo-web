@font-face{font-family:"Libertinus Serif";font-style:normal;font-weight:400;font-display:swap;src:url(/libertinus-serif-latin-400-normal.woff2) format("woff2")}

:root{
  /* Paleta del manual de identidad ÁLVEO (ed. 1.0, 24-oct-2026) */
  --crema:#F6F1E8;   /* 55 % */
  --piedra:#D9D2C7;  /* 25 % */
  --carbon:#1A1A1A;  /* 15 % */
  --oliva:#3F4634;   /*  5 % */
  --tinta-suave:#55524C;
  --serif:"Libertinus Serif","Linux Libertine","Georgia",serif;
  --sans:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --margen:clamp(20px,5vw,72px);
}
*{box-sizing:border-box;margin:0}
html{background:var(--crema);color:var(--carbon);-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:0 var(--margen);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--oliva);outline-offset:3px}

/* Cabecera editorial, como el manual */
.barra{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0 14px;border-bottom:1px solid var(--carbon);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.barra b{font-weight:700}

main{flex:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2.4vw,32px);align-items:center;padding:clamp(28px,6vh,72px) 0}

/* Firma vertical sobre piedra */
.firma{grid-column:1 / span 6;background:var(--piedra);aspect-ratio:4/5;max-height:72vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10% 12%}
.firma .iso{width:72%;height:auto;display:block}
.firma .logo{width:85%;color:var(--carbon);margin-top:9%;display:block}
.firma .desc{margin-top:4.5%;font-size:clamp(11px,1.15vw,15px);letter-spacing:.42em;padding-left:.42em;text-transform:uppercase}

.texto{grid-column:8 / span 5}
.pronto{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--oliva)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.4vw,76px);line-height:1.06;letter-spacing:-.005em;margin-top:18px}
.apoyo{font-size:clamp(17px,1.5vw,21px);margin-top:22px}
.oficio{font-family:var(--serif);font-style:italic;font-size:clamp(19px,1.7vw,24px);line-height:1.35;color:var(--tinta-suave);margin-top:28px;padding-top:24px;border-top:1px solid var(--piedra);max-width:28ch}

.acciones{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-top:36px}
.boton{display:inline-flex;align-items:center;gap:10px;background:var(--carbon);color:var(--crema);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:15px 22px;min-height:48px;transition:background-color .2s}
.boton:hover{background:var(--oliva)}
.boton svg{width:18px;height:18px;flex:none}
.correo{font-size:15px;text-decoration:none;border-bottom:1px solid currentColor;padding:6px 0}
.correo:hover{color:var(--oliva)}

footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--piedra);padding:16px 0 22px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-suave)}

@media (max-width:860px){
  main{grid-template-columns:1fr;row-gap:36px;align-items:start}
  .firma,.texto{grid-column:1 / -1}
  .firma{aspect-ratio:auto;max-height:none;padding:13% 12% 11%}
  .firma .desc{font-size:12px}
  .barra .lugar{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .firma,.texto{animation:entra .9s cubic-bezier(.2,.7,.2,1) both}
  .texto{animation-delay:.12s}
  @keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
